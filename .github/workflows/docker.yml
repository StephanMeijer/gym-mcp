# Reusable image build. push=false: validate that the Dockerfile builds (CI).
# push=true: build (amd64 for now), push by digest, merge into one
# manifest list tagged X.Y.Z / X.Y / X / latest, and attest build provenance.
#
# Jobs declare no `permissions:` and inherit the caller's. A nested job asking for
# more than the caller has fails the whole run ("workflow file issue"), and PRs from
# forks and bots (release-plz) only ever get a read-only token. So CI calls this with
# read-only access, and only release.yml grants packages/id-token/attestations write.
name: Docker

on:
  workflow_call:
    inputs:
      push:
        type: boolean
        default: false
      ref:
        description: Git ref to check out. Empty = the triggering SHA.
        type: string
        default: ""
      tag_name:
        description: Release tag (vX.Y.Z), required when push=true.
        type: string
        default: ""

env:
  IMAGE: ghcr.io/stephanmeijer/gym-mcp

jobs:
  build:
    name: Build ${{ matrix.arch }}
    # Our own runners (no Docker daemon, amd64 only); fork PRs run untrusted code, so GitHub's.
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || '9xx' }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # shortcut: amd64 only, the 9xx nodes have no arm64; add arm64 back with arm runners.
          - { arch: amd64, platform: linux/amd64 }
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      # GitHub-hosted: buildx's default docker-container driver always runs buildkitd privileged,
      # so run a rootless one ourselves, unprivileged, and point buildx at it (remote driver).
      - name: Start rootless buildkitd
        if: runner.environment == 'github-hosted'
        run: |
          set -euo pipefail
          # Ubuntu 23.10+ blocks user namespaces for unprivileged processes; rootlesskit needs one.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          docker run -d --name buildkitd \
            --security-opt seccomp=unconfined --security-opt apparmor=unconfined \
            -p 127.0.0.1:1234:1234 "${BUILDKIT_IMAGE}" \
            --oci-worker-no-process-sandbox --addr tcp://0.0.0.0:1234
          for _ in $(seq 30); do
            docker exec buildkitd buildctl --addr tcp://127.0.0.1:1234 debug workers >/dev/null 2>&1 && break
            sleep 1
          done
          docker exec buildkitd buildctl --addr tcp://127.0.0.1:1234 debug workers \
            || { docker logs buildkitd; exit 1; }
          echo "buildkitd runs as uid $(docker exec buildkitd id -u)"
        env:
          BUILDKIT_IMAGE: moby/buildkit:v0.34.2-rootless@sha256:c8252268760e1baba80780d63d738ef9f260fb7c7c0973c78494cb9ddd99eda1
      # Self-hosted (9xx): the BuildKit the cluster provides, at the repo variable BUILDKIT_HOST.
      - name: Require BUILDKIT_HOST
        if: runner.environment != 'github-hosted'
        env:
          BUILDKIT_HOST: ${{ vars.BUILDKIT_HOST }}
        run: |
          [ -n "${BUILDKIT_HOST}" ] || { echo "::error::repo variable BUILDKIT_HOST is not set" >&2; exit 1; }
      - uses: docker/setup-buildx-action@v4.4.1
        with:
          driver: remote
          endpoint: ${{ runner.environment == 'github-hosted' && 'tcp://127.0.0.1:1234' || vars.BUILDKIT_HOST }}
      - name: Refuse a release build without a version tag
        if: inputs.push
        env:
          TAG_NAME: ${{ inputs.tag_name }}
        run: |
          case "${TAG_NAME}" in
            v[0-9]*) ;;
            *) echo "::error::tag_name='${TAG_NAME}' is not a vX.Y.Z tag" >&2; exit 1 ;;
          esac
      - uses: docker/login-action@v4.7.0
        if: inputs.push
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build ${{ matrix.platform }}
        id: build
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          provenance: false
          outputs: >-
            ${{ inputs.push
              && format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', env.IMAGE)
              || 'type=cacheonly' }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.arch }},mode=max
      - name: Record digest
        if: inputs.push
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          [ -n "${DIGEST}" ] || { echo "::error::build produced no digest" >&2; exit 1; }
          mkdir -p /tmp/digests && touch "/tmp/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v7.0.2
        if: inputs.push
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Multi-arch manifest
    if: inputs.push
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags and annotations
        id: meta
        uses: docker/metadata-action@v6.2.0
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.tag_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.tag_name }}
            type=semver,pattern={{major}},value=${{ inputs.tag_name }},enable=${{ !startsWith(inputs.tag_name, 'v0.') }}
            type=raw,value=latest,enable=${{ !contains(inputs.tag_name, '-') }}
          labels: |
            org.opencontainers.image.title=gym-mcp
            org.opencontainers.image.description=MCP server that turns Claude/ChatGPT into a gym logbook
            org.opencontainers.image.source=https://github.com/StephanMeijer/gym-mcp
            org.opencontainers.image.licenses=MPL-2.0
      - name: Create manifest list
        working-directory: /tmp/digests
        env:
          TAGS_JSON: ${{ steps.meta.outputs.json }}
          ANNOTATIONS: ${{ steps.meta.outputs.annotations }}
        run: |
          set -euo pipefail
          mapfile -t tags < <(jq -er '.tags[]' <<<"$TAGS_JSON")
          mapfile -t annotations < <(printf '%s\n' "$ANNOTATIONS" | sed '/^$/d')
          sources=()
          for d in *; do sources+=("${IMAGE}@sha256:${d}"); done
          docker buildx imagetools create \
            "${tags[@]/#/--tag=}" \
            "${annotations[@]/#/--annotation=}" \
            "${sources[@]}"
      - name: Resolve index digest
        id: index
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          digest=$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" --format '{{json .Manifest}}' | jq -er '.digest')
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          docker buildx imagetools inspect "${IMAGE}@${digest}"
      - uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.index.outputs.digest }}
          push-to-registry: true
