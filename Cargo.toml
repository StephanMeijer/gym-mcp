[package]
name = "gym-mcp"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
description = "MCP server that turns Claude/ChatGPT into a gym logbook"
repository = "https://github.com/StephanMeijer/gym-mcp"
publish = false

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
chrono = { version = "0.4.45", features = ["serde"] }
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["rust_crypto", "use_pem"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
rmcp = { version = "3.8.0", features = ["server", "macros", "transport-streamable-http-server"] }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.0", features = ["postgres", "runtime-tokio", "macros", "migrate", "chrono", "json"] }
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
